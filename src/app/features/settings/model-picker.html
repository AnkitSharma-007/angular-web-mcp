<ul
  ngListbox
  aria-label="Gemini model"
  selectionMode="follow"
  class="m-0 flex list-none flex-col gap-2 p-0"
  [value]="selection()"
  (valueChange)="choose($event)"
>
  @for (card of cards(); track card.id) {
    <li
      ngOption
      class="flex cursor-pointer flex-col gap-1 rounded-xl border border-outline-variant px-3 py-2 aria-selected:border-primary aria-selected:bg-[color-mix(in_srgb,var(--mat-sys-primary)_14%,transparent)]"
      [value]="card.id"
      [label]="card.persona"
      [attr.data-testid]="'model-' + card.id"
    >
      <span class="flex items-center gap-2 text-sm font-medium text-on-surface">
        <span aria-hidden="true">{{ card.emoji }}</span>
        <span>{{ card.persona }}</span>
        <span class="text-xs font-normal text-on-surface-variant">{{ card.id }}</span>
        @if (card.freeTier) {
          <span
            class="ml-auto rounded-full border border-outline-variant px-2 py-0.5 text-xs"
            data-testid="free-badge"
          >
            Free tier
          </span>
        } @else {
          <span
            class="ml-auto rounded-full border border-error px-2 py-0.5 text-xs text-error"
            data-testid="paid-badge"
          >
            Paid tier
          </span>
        }
      </span>
      <span class="text-xs text-on-surface-variant">
        {{ card.role }} · thinking {{ card.thinkingLevel }} · ${{ card.price.inputPerM }} in / ${{
          card.price.outputPerM
        }}
        out per 1M tokens
      </span>
    </li>
  }
</ul>
