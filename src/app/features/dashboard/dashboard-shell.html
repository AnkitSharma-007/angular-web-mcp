<app-byok-banner />
<nav aria-label="Dashboard sections" class="flex gap-2">
  <a
    routerLink="/dashboard"
    class="rounded-full px-4 py-1.5 text-sm font-medium no-underline"
    [class.bg-primary]="overviewActive()"
    [class.text-on-surface-variant]="!overviewActive()"
    [class.text-on-primary]="overviewActive()"
    [attr.aria-current]="overviewActive() ? 'page' : null"
  >
    Overview
  </a>
  <a
    routerLink="/dashboard/lab"
    class="rounded-full px-4 py-1.5 text-sm font-medium no-underline"
    [class.bg-primary]="labActive()"
    [class.text-on-surface-variant]="!labActive()"
    [class.text-on-primary]="labActive()"
    [attr.aria-current]="labActive() ? 'page' : null"
  >
    Lab
  </a>
  <button
    type="button"
    class="ml-auto cursor-pointer rounded-full border border-outline-variant bg-transparent px-4 py-1.5 text-sm font-medium text-on-surface"
    data-testid="toggle-console"
    [attr.aria-pressed]="layout.consoleOpen()"
    (click)="layout.toggleConsole()"
  >
    Agent console
  </button>
</nav>
<router-outlet />
@if (layout.consoleOpen()) {
  <app-agent-console />
}
@if (ui.proposalOpen()) {
  <app-proposal-drawer />
}
