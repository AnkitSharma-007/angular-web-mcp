<app-glass-card class="h-full" [accent]="accent()">
  <p class="m-0 text-sm text-on-surface-variant">{{ label() }}</p>
  <p class="mt-1 mb-0 text-2xl font-semibold tabular-nums text-on-surface">{{ value() }}</p>
  @if (hint()) {
    <p class="mt-1 mb-0 text-xs text-on-surface-variant">{{ hint() }}</p>
  }
</app-glass-card>
