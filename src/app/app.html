<header class="sticky top-0 z-10">
  <mat-toolbar class="glass [--mat-toolbar-container-background-color:transparent]">
    <h1 class="m-0 text-xl font-semibold tracking-tight">{{ title }}</h1>
    <nav aria-label="Primary" class="ml-6 flex gap-1">
      <a
        routerLink="/dashboard"
        class="rounded-full px-3 py-1 text-sm font-medium no-underline"
        [class.text-primary]="dashboardActive()"
        [class.text-on-surface-variant]="!dashboardActive()"
        [attr.aria-current]="dashboardActive() ? 'page' : null"
      >
        Dashboard
      </a>
      <a
        routerLink="/about"
        class="rounded-full px-3 py-1 text-sm font-medium no-underline"
        [class.text-primary]="aboutActive()"
        [class.text-on-surface-variant]="!aboutActive()"
        [attr.aria-current]="aboutActive() ? 'page' : null"
      >
        About
      </a>
    </nav>
    <span class="flex-1"></span>
    <span
      class="mr-2 rounded-full border border-outline-variant px-3 py-1 text-xs font-medium text-on-surface-variant"
      data-testid="registry-chip"
      [attr.data-kind]="registryKind"
      [attr.title]="'WebMCP registry: ' + registryKind"
    >
      WebMCP: {{ registryKind }}
    </span>
    <button
      #inspectorToggle
      mat-icon-button
      type="button"
      aria-label="Wire inspector"
      title="Wire inspector (`)"
      data-testid="toggle-inspector"
      [attr.aria-pressed]="layout.inspectorOpen()"
      (click)="layout.toggleInspector()"
    >
      <mat-icon>cable</mat-icon>
    </button>
    <button
      mat-icon-button
      type="button"
      data-testid="open-key-dialog"
      [attr.aria-label]="settings.hasKey() ? 'Gemini API key and model' : 'Add Gemini API key'"
      (click)="openKeyDialog()"
    >
      <mat-icon>{{ settings.hasKey() ? 'key' : 'key_off' }}</mat-icon>
    </button>
  </mat-toolbar>
</header>
<main class="p-4" [style.padding-bottom]="layout.inspectorOpen() ? '48vh' : null">
  <router-outlet />
</main>
@defer (on interaction(inspectorToggle); when layout.inspectorOpen(); prefetch on idle) {
  @if (layout.inspectorOpen()) {
    <app-wire-inspector />
  }
}
